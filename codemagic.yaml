workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local properties and dependencies
        script: |
          flutter packages pub get
      - name: CocoaPods installation
        script: |
          cd ios
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile found; flutter build ios will handle dependencies."
          fi
      - name: Flutter build iOS (no code sign for testing)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - /Users/builder/clone/ios/build/Runner.xcarchive
