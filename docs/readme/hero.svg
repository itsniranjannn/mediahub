<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="MediaHub — music, video and YouTube in one place">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A0418"/>
      <stop offset="0.55" stop-color="#2A1230"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A92"/>
      <stop offset="1" stop-color="#F69E1C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#CC324C"/>
      <stop offset="1" stop-color="#F69E1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#CC324C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#CC324C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF3E6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF3E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFF3E6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font:700 64px Georgia,'Times New Roman',serif;fill:url(#title)}
      .s{font:400 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFF3E6;opacity:.85}
      .k{font:500 13px 'Courier New',monospace;fill:#F69E1C;letter-spacing:3px}
      .b{fill:url(#bar);transform-box:fill-box;transform-origin:bottom;animation:eq 1.2s ease-in-out infinite alternate}
      .b:nth-child(2){animation-delay:-.2s}.b:nth-child(3){animation-delay:-.5s}.b:nth-child(4){animation-delay:-.8s}
      .b:nth-child(5){animation-delay:-.35s}.b:nth-child(6){animation-delay:-.65s}.b:nth-child(7){animation-delay:-.1s}
      @keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
      .sw{animation:sweep 6s ease-in-out infinite}
      @keyframes sweep{0%,60%{transform:translateX(-400px)}100%{transform:translateX(1000px)}}
      .fade{animation:in 1.2s ease-out both}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
      @media (prefers-reduced-motion:reduce){.b,.sw,.fade,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect width="900" height="260" rx="24" fill="url(#glow)"/>
  <g class="fade">
    <text x="56" y="70" class="k">MUSIC · VIDEO · YOUTUBE · DOWNLOADS</text>
    <text x="52" y="146" class="t">MediaHub</text>
    <text x="56" y="186" class="s">Your family's music, videos and YouTube — in one beautiful app.</text>
    <text x="56" y="214" class="s" style="font-size:16px;opacity:.65">नमस्ते · Android &amp; iOS · built with Flutter</text>
  </g>
  <g transform="translate(640 70)">
    <circle class="pulse" cx="100" cy="64" r="58" fill="#CC324C"/>
    <path d="M86 38 L124 64 L86 90 Z" fill="#FFF3E6"/>
  </g>
  <g transform="translate(600 180)">
    <rect class="b" x="0"   y="0" width="14" height="56" rx="7"/>
    <rect class="b" x="24"  y="0" width="14" height="56" rx="7"/>
    <rect class="b" x="48"  y="0" width="14" height="56" rx="7"/>
    <rect class="b" x="72"  y="0" width="14" height="56" rx="7"/>
    <rect class="b" x="96"  y="0" width="14" height="56" rx="7"/>
    <rect class="b" x="120" y="0" width="14" height="56" rx="7"/>
    <rect class="b" x="144" y="0" width="14" height="56" rx="7"/>
  </g>
  <rect class="sw" x="0" y="0" width="260" height="260" fill="url(#shine)"/>
</svg>
